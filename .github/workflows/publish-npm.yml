name: Publish to npm

on:
  push:
    branches: [ 'prod' ]
  workflow_dispatch:

jobs:
  deploy-npm:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'

    - name: Checkout shared packages
      run: git clone --depth 1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/todoforai/packages.git ../packages

    - name: Install dependencies
      # The shared packages are cloned OUTSIDE this checkout, so bun's hoist into
      # ./node_modules is invisible to them — their own file: deps must be installed
      # in place or the bundler can't resolve @shared/* from their sources.
      run: |
        bun install
        (cd ../packages/shared-api && bun install)

    - name: Resolve version & publish
      id: publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        PACKAGE_NAME=$(jq -r '.name' package.json)
        LOCAL_VERSION=$(jq -r '.version' package.json)
        NPM_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")

        # Use local if strictly higher than npm (manual major/minor bump); else auto-patch from npm
        HIGHER=$(printf '%s\n%s\n' "$LOCAL_VERSION" "$NPM_VERSION" | sort -V | tail -1)
        if [ "$LOCAL_VERSION" = "$HIGHER" ] && [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
          NEW_VERSION="$LOCAL_VERSION"
        else
          NEW_VERSION=$(echo "$NPM_VERSION" | awk -F. '{print $1"."$2"."($3+1)}')
        fi

        # Rewrite package.json: pin version, drop the @shared/* file: deps (bundled into dist)
        node -e "
          const pkg = require('./package.json');
          pkg.version = '$NEW_VERSION';
          for (const d of ['dependencies', 'devDependencies'])
            for (const k of Object.keys(pkg[d] || {})) if (k.startsWith('@shared/')) delete pkg[d][k];
          require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
        "

        # Build AFTER the version rewrite: src/args.ts imports package.json, so the
        # bundle inlines whatever version is on disk at build time. Building first
        # shipped the PREVIOUS version — `--version` reported 0.1.24 from a 0.1.26
        # package until this was reordered.
        bun run build

        # The @shared/* deps were stripped above because the bundle inlines them.
        # Fail loudly if the bundle still needs one at runtime.
        ! grep -qE '(from|require\()["'"'"']@shared/' dist/todoforai-cli.js

        echo "Publishing $PACKAGE_NAME@$NEW_VERSION (npm had $NPM_VERSION, local was $LOCAL_VERSION)"
        npm publish --access public --ignore-scripts
        echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

    - name: Push release tag (no branch commit)
      if: success() && steps.publish.outputs.new_version
      env:
        NEW_VERSION: ${{ steps.publish.outputs.new_version }}
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
        git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
        git push origin "v$NEW_VERSION"
