# Standalone binaries on GitHub Releases — what the todofor.ai/cli(.ps1) installers
# download when the machine has neither bun nor npm. Without a release here that
# fallback 404'd on api.github.com/repos/todoforai/cli/releases/latest.
#
# Called by publish-npm.yml after each publish (its tag push uses GITHUB_TOKEN,
# which can't trigger workflows), or by hand for an existing tag.
# Asset names are the installers' contract: todoforai-cli-<linux|macos|windows>-<x64|arm64>[.exe].

name: Release binaries

on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
  workflow_dispatch:
    inputs:
      tag: { description: 'Existing tag to release, e.g. v0.1.91', type: string, required: true }

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"   # same pin as publish-npm.yml

    - name: Checkout shared packages
      run: git clone --depth 1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/todoforai/packages.git ../packages

    - name: Install dependencies
      run: |
        bun install
        (cd ../packages/shared-credentials && bun install)
        (cd ../packages/shared-api && bun install)

    - name: Compile
      env:
        TAG: ${{ inputs.tag }}
      run: |
        # The tag's package.json carries a stale version (publish-npm rewrites it
        # without committing); src/args.ts inlines it, so pin it from the tag.
        node -e "const p=require('./package.json'); p.version=process.env.TAG.replace(/^v/,''); require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
        mkdir -p release
        for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
          out="release/todoforai-cli-${t/darwin/macos}"
          [ "$t" = windows-x64 ] && out="$out.exe"
          bun build src/index.ts --compile --minify --target="bun-$t" --outfile "$out"
        done
        ./release/todoforai-cli-linux-x64 --version | grep -qx "${TAG#v}"
        ls -la release

    - uses: actions/upload-artifact@v4
      with:
        name: cli-binaries
        path: release/
        retention-days: 3

  # Windows exe: Azure Trusted Signing, same profile as the bridge (TODO for AI Kft.).
  # Unsigned, SmartScreen/Defender treat a fresh 100 MB exe as unknown and warn.
  sign-windows:
    needs: binaries
    runs-on: windows-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: cli-binaries
        path: release

    - name: Sign with Azure Trusted Signing
      shell: pwsh
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      run: |
        cargo install trusted-signing-cli --version 0.11.0 --locked
        $exe = "release/todoforai-cli-windows-x64.exe"
        trusted-signing-cli -e "${{ secrets.AZURE_SIGNING_ENDPOINT }}" -a "${{ secrets.AZURE_SIGNING_ACCOUNT }}" -c "${{ secrets.AZURE_SIGNING_PROFILE }}" -d TODOforAI $exe
        if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        & $signtool verify /pa $exe
        if ($LASTEXITCODE -ne 0) { Write-Error "exe is not signed"; exit 1 }

    - uses: actions/upload-artifact@v4
      with:
        name: cli-windows-signed
        path: release/todoforai-cli-windows-x64.exe
        retention-days: 3

  publish:
    needs: sign-windows
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: cli-binaries
        path: release

    # Signing changed the exe's bytes: take the signed one, then checksum.
    - uses: actions/download-artifact@v4
      with:
        name: cli-windows-signed
        path: release

    - name: Checksums
      run: cd release && rm -f SHA256SUMS && chmod +x todoforai-cli-* && sha256sum * > SHA256SUMS && ls -la

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        GH_REPO: ${{ github.repository }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" release/* --clobber
        else
          gh release create "$TAG" release/* --title "todoforai-cli $TAG" --notes "npm: @todoforai/cli@${TAG#v}" --latest
        fi
